{% extends "base.html" %}

{% block content %}
  <div class="jumbotron">
    <div class="container">
      <h1>
        {% trans %}Challenges{% endtrans %}
      </h1>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-md-12">
        {% include "components/errors.html" %}
      </div>
    </div>

    <div 
      x-data="ChallengeBoard" 
      @load-challenges.window="loadChallenges()" 
      @load-challenge.window="loadChallenge($event.detail)"
    >
      <div
          x-ref="challengeWindow" id="challenge-window" class="modal fade" tabindex="-1" role="dialog" x-data=""
          x-html="$store.challenge.data.view"
      ></div>

      <div x-show="!loaded">
        <div class="min-vh-50 d-flex align-items-center">
          <div class="text-center w-100">
            <i class="fas fa-circle-notch fa-spin fa-3x fa-fw spinner"></i>
          </div>
        </div>
      </div>

      <div x-show="loaded" class="text-end mb-2">
        <button type="button" class="btn btn-sm btn-outline-secondary gcit-view-toggle" @click="toggleBoardView()">
          <i class="fas" :class="boardView === 'grid' ? 'fa-diagram-project' : 'fa-table-cells'"></i>
          <span x-text="boardView === 'grid' ? '{% trans %}Skill Tree View{% endtrans %}' : '{% trans %}Grid View{% endtrans %}'"></span>
        </button>
      </div>

      <!-- Phase 7 gamification: Skill Tree / Node Map view -->
      <div x-show="loaded && boardView === 'nodes'" x-cloak class="gcit-node-map-wrap">
        <svg x-ref="nodemap" class="gcit-node-map" role="img" aria-label="{% trans %}Challenge skill tree{% endtrans %}"></svg>
        <p class="text-center text-muted small mt-2">
          <span class="gcit-node-map__legend-dot gcit-node-map__legend-dot--solved"></span> {% trans %}Solved{% endtrans %}
          &nbsp;&nbsp;
          <span class="gcit-node-map__legend-dot gcit-node-map__legend-dot--unsolved"></span> {% trans %}Unsolved{% endtrans %}
        </p>
      </div>

      <div x-show="loaded && boardView === 'grid'" class="gcit-challenge-board">
        <template x-for="(category, idx) in getCategories()" :key="idx">
          <div class="pt-5">
            <div class="category-header mb-3">
              <h3 class="d-inline-block">
                <span class="gcit-category-icon" x-text="getCategoryIcon(category)"></span>
                <span x-text="category"></span>
              </h3>
            </div>

            <div class="category-challenges d-flex flex-column">
              <div class="challenges-row row">
                <template x-for="(c, idx) in getChallenges(category)" :key="c.id">
                  <div class="col-sm-6 col-md-4 col-lg-3 my-3 position-relative">
                    <span
                        class="gcit-tier-ribbon gcit-tier-ribbon--boss" x-show="getTier(c.value) === 'boss'"
                    >boss</span>
                    <span
                        class="gcit-tier-ribbon gcit-tier-ribbon--elusive" x-show="getTier(c.value) === 'elusive'"
                    >elusive</span>
                    <span
                        class="gcit-tier-ribbon gcit-tier-ribbon--first-blood"
                        x-show="!c.solved_by_me && c.solves === 0"
                    ><i class="fas fa-droplet fa-fw"></i> first blood</span>
                    <button
                        class="challenge-button btn btn-dark w-100 h-100"
                        :class="[
                          c.solved_by_me ? 'challenge-solved' : '',
                          `gcit-tier-${getTier(c.value)}`,
                          ...c.tags.map((tag) => `tag-${tag.value.replace(/ /g, '-')}`),
                        ];"
                        :value="c.id" @click="loadChallenge(c.id)"
                    >

                      <div class="challenge-inner my-3">
                        <p x-text="c.name"></p>
                        <span x-text="c.value"></span>
                      </div>
                    </button>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/challenges.js") }}
{% endblock %}
